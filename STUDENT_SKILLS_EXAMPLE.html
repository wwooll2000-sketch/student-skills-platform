<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تطبيق إدارة مهارات الطلاب</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            background: white;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 30px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        header h1 {
            color: #333;
            margin-bottom: 10px;
        }

        header p {
            color: #666;
            font-size: 14px;
        }

        .main-grid {
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 20px;
            margin-bottom: 30px;
        }

        .sidebar {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .card {
            background: white;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .card h2 {
            color: #333;
            margin-bottom: 15px;
            font-size: 18px;
            border-bottom: 2px solid #667eea;
            padding-bottom: 10px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            color: #555;
            margin-bottom: 5px;
            font-weight: 500;
        }

        input, select, textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-family: inherit;
            font-size: 14px;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        button {
            background: #667eea;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.3s ease;
            width: 100%;
        }

        button:hover {
            background: #764ba2;
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(102, 126, 234, 0.3);
        }

        button.secondary {
            background: #6c757d;
            margin-top: 10px;
        }

        button.secondary:hover {
            background: #5a6268;
        }

        button.danger {
            background: #dc3545;
        }

        button.danger:hover {
            background: #c82333;
        }

        .skills-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 15px;
        }

        .skill-card {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            border-radius: 8px;
            padding: 15px;
            border: 1px solid #e0e0e0;
            transition: all 0.3s ease;
        }

        .skill-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 16px rgba(0,0,0,0.1);
        }

        .skill-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .skill-header h4 {
            color: #333;
            margin: 0;
        }

        .skill-category {
            background: #667eea;
            color: white;
            padding: 3px 8px;
            border-radius: 3px;
            font-size: 12px;
        }

        .level-bar {
            background: #e0e0e0;
            height: 8px;
            border-radius: 4px;
            overflow: hidden;
            margin: 10px 0;
        }

        .level-fill {
            background: linear-gradient(90deg, #667eea, #764ba2);
            height: 100%;
            transition: width 0.3s ease;
        }

        .level-text {
            display: block;
            text-align: center;
            color: #666;
            font-size: 12px;
            margin-bottom: 10px;
        }

        .skill-notes {
            color: #666;
            font-size: 13px;
            margin-bottom: 10px;
            font-style: italic;
        }

        .skill-meta {
            color: #999;
            font-size: 11px;
            margin-bottom: 10px;
        }

        .skill-actions {
            display: flex;
            gap: 5px;
        }

        .skill-actions button {
            flex: 1;
            padding: 8px;
            font-size: 12px;
            background: #667eea;
        }

        .skill-actions button:hover {
            background: #764ba2;
        }

        .empty-state {
            text-align: center;
            color: #999;
            padding: 30px 20px;
            font-style: italic;
        }

        .statistics {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }

        .stat-item {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
        }

        .stat-item h5 {
            font-size: 12px;
            opacity: 0.9;
            margin-bottom: 10px;
        }

        .stat-value {
            font-size: 32px;
            font-weight: bold;
        }

        .level-distribution {
            display: flex;
            gap: 5px;
            justify-content: center;
            margin-top: 10px;
        }

        .level-bar {
            background: rgba(255,255,255,0.3);
            padding: 5px;
            border-radius: 3px;
            font-size: 11px;
            min-width: 30px;
            text-align: center;
        }

        .level-distribution .count {
            font-weight: bold;
            margin-top: 5px;
        }

        .action-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 20px;
        }

        .action-buttons button {
            padding: 10px;
            font-size: 13px;
        }

        @keyframes slideIn {
            from {
                transform: translateX(400px);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        @keyframes slideOut {
            from {
                transform: translateX(0);
                opacity: 1;
            }
            to {
                transform: translateX(400px);
                opacity: 0;
            }
        }

        .connection-status {
            position: fixed;
            bottom: 20px;
            left: 20px;
            padding: 10px 15px;
            border-radius: 5px;
            font-size: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
            z-index: 999;
        }

        .connection-status.online {
            background: #28a745;
            color: white;
        }

        .connection-status.offline {
            background: #dc3545;
            color: white;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background: white;
            border-radius: 50%;
        }

        @media (max-width: 768px) {
            .main-grid {
                grid-template-columns: 1fr;
            }

            .skills-grid {
                grid-template-columns: 1fr;
            }

            .action-buttons {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

<!-- حالة الاتصال -->
<div class="connection-status online" id="connectionStatus">
    <span class="status-dot"></span>
    <span id="connectionText">متصل بالإنترنت</span>
</div>

<div class="container">
    <!-- الرأس -->
    <header>
        <h1>📚 تطبيق إدارة مهارات الطلاب</h1>
        <p>نظام متكامل لتتبع وتقييم مهارات الطلاب مع الحفظ المحلي والمزامنة الآلية</p>
    </header>

    <!-- المحتوى الرئيسي -->
    <div class="main-grid">
        <!-- الشريط الجانبي -->
        <aside class="sidebar">
            <!-- إضافة طالب جديد -->
            <div class="card">
                <h2>➕ إضافة طالب جديد</h2>
                <form onsubmit="event.preventDefault(); handleAddStudent();">
                    <div class="form-group">
                        <label>اسم الطالب</label>
                        <input type="text" id="studentName" placeholder="أدخل اسم الطالب" required>
                    </div>
                    <div class="form-group">
                        <label>البريد الإلكتروني (اختياري)</label>
                        <input type="email" id="studentEmail" placeholder="البريد الإلكتروني">
                    </div>
                    <div class="form-group">
                        <label>الفصل (اختياري)</label>
                        <input type="text" id="studentClass" placeholder="الفصل الدراسي">
                    </div>
                    <button type="submit">إضافة الطالب</button>
                </form>
            </div>

            <!-- إضافة مهارة -->
            <div class="card">
                <h2>🎯 إضافة مهارة</h2>
                <form onsubmit="event.preventDefault(); handleAddSkill();">
                    <div class="form-group">
                        <label>اسم المهارة</label>
                        <input type="text" id="skillName" placeholder="مثال: القراءة السريعة" required>
                    </div>
                    <div class="form-group">
                        <label>الدرجة (1-5)</label>
                        <input type="number" id="skillLevel" min="1" max="5" placeholder="الدرجة" required>
                    </div>
                    <div class="form-group">
                        <label>الفئة</label>
                        <select id="skillCategory" required>
                            <option value="عام">عام</option>
                            <option value="قراءة">قراءة</option>
                            <option value="كتابة">كتابة</option>
                            <option value="تحدث">تحدث</option>
                            <option value="استماع">استماع</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>ملاحظات</label>
                        <textarea id="skillNotes" placeholder="أضف ملاحظات حول المهارة" rows="3"></textarea>
                    </div>
                    <button type="submit">إضافة المهارة</button>
                </form>
            </div>

            <!-- ملاحظات الطالب -->
            <div class="card">
                <h2>📝 ملاحظات الطالب</h2>
                <textarea id="studentNotes" placeholder="أضف ملاحظاتك هنا" rows="5" onchange="handleSaveNotes()"></textarea>
                <button onclick="handleSaveNotes()">حفظ الملاحظات</button>
            </div>

            <!-- الإجراءات -->
            <div class="card">
                <h2>⚙️ الإجراءات</h2>
                <div class="action-buttons">
                    <button onclick="handleExportData()">💾 تصدير النسخة</button>
                    <button class="secondary" onclick="document.getElementById('importFile').click()">📁 استيراد النسخة</button>
                    <button class="secondary" onclick="handleManualSync()">🔄 مزامنة يدوية</button>
                    <button class="danger" onclick="handleClearData()">🗑️ مسح البيانات</button>
                </div>
                <input type="file" id="importFile" accept=".json" style="display: none;" onchange="handleImportData(event)">
            </div>
        </aside>

        <!-- المحتوى الرئيسي -->
        <main>
            <!-- معلومات الطالب -->
            <div class="card">
                <h2>📊 <span id="studentName">اختر طالباً</span></h2>
                <div id="statisticsContainer"></div>
            </div>

            <!-- المهارات -->
            <div class="card">
                <h2>🏆 مهارات الطالب</h2>
                <div id="skillsList" class="skills-grid"></div>
            </div>
        </main>
    </div>
</div>

<!-- المكتبات المطلوبة -->
<script src="local-storage-sync.js"></script>
<script src="local-storage-examples.js"></script>
<script src="student-skills-app.js"></script>

<script>
    // ===================== معالجات الأحداث =====================

    /**
     * إضافة طالب جديد
     */
    function handleAddStudent() {
        const name = document.getElementById('studentName').value;
        const email = document.getElementById('studentEmail').value;
        const className = document.getElementById('studentClass').value;

        if (!name) {
            app.showNotification('يرجى إدخال اسم الطالب', 'error');
            return;
        }

        const studentCode = app.addNewStudent(name, email || null, className || null);

        if (studentCode) {
            document.getElementById('studentName').value = '';
            document.getElementById('studentEmail').value = '';
            document.getElementById('studentClass').value = '';
            
            app.displayStudentDashboard(studentCode);
        }
    }

    /**
     * إضافة مهارة
     */
    function handleAddSkill() {
        if (!app.currentStudentId) {
            app.showNotification('يرجى اختيار/إضافة طالب أولاً', 'error');
            return;
        }

        const name = document.getElementById('skillName').value;
        const level = parseInt(document.getElementById('skillLevel').value);
        const category = document.getElementById('skillCategory').value;
        const notes = document.getElementById('skillNotes').value;

        if (!name || !level) {
            app.showNotification('يرجى ملء جميع الحقول المطلوبة', 'error');
            return;
        }

        app.addOrUpdateSkill(name, level, category, notes);

        document.getElementById('skillName').value = '';
        document.getElementById('skillLevel').value = '';
        document.getElementById('skillCategory').value = 'عام';
        document.getElementById('skillNotes').value = '';
    }

    /**
     * حفظ الملاحظات
     */
    function handleSaveNotes() {
        if (!app.currentStudentId) {
            app.showNotification('يرجى اختيار/إضافة طالب أولاً', 'error');
            return;
        }

        const notes = document.getElementById('studentNotes').value;
        app.saveStudentNotes(notes);
    }

    /**
     * تصدير البيانات
     */
    function handleExportData() {
        app.exportAllData();
    }

    /**
     * استيراد البيانات
     */
    function handleImportData(event) {
        const file = event.target.files[0];
        if (file) {
            app.importData(file);
        }
    }

    /**
     * مزامنة يدوية
     */
    function handleManualSync() {
        app.showNotification('جاري المزامنة...', 'info');
        app.syncManager.syncWithDatabase().then(success => {
            if (success) {
                app.showNotification('✅ تمت المزامنة بنجاح', 'success');
            } else {
                app.showNotification('❌ فشلت المزامنة', 'error');
            }
        });
    }

    /**
     * مسح البيانات
     */
    function handleClearData() {
        app.clearAllData();
    }

    // ===================== متابعة حالة الاتصال =====================

    function updateConnectionStatus() {
        const statusElement = document.getElementById('connectionStatus');
        const statusText = document.getElementById('connectionText');

        if (navigator.onLine) {
            statusElement.classList.remove('offline');
            statusElement.classList.add('online');
            statusText.textContent = '🟢 متصل بالإنترنت';
        } else {
            statusElement.classList.remove('online');
            statusElement.classList.add('offline');
            statusText.textContent = '🔴 غير متصل بالإنترنت';
        }
    }

    window.addEventListener('online', updateConnectionStatus);
    window.addEventListener('offline', updateConnectionStatus);
    updateConnectionStatus();

    // إظهار رسالة قصيرة عند التحميل
    window.addEventListener('load', () => {
        console.log('✅ تم تحميل صفحة تطبيق إدارة مهارات الطلاب');
        console.log('📖 المساعدة: اطلع على LOCAL_STORAGE_GUIDE.html للمزيد من المعلومات');
    });
</script>

</body>
</html>
