<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام مهارات الطلاب</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="manifest" href="manifest.json">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap');

        body {
            font-family: 'Tajawal', sans-serif;
            background-color: #f8fafc;
        }

        /* Mobile touch improvements */
        @media (max-width: 768px) {

            input,
            button,
            select {
                min-height: 44px;
                /* Better touch targets */
            }

            .mobile-scroll {
                overflow-x: auto;
                -webkit-overflow-scrolling: touch;
            }
        }

        /* Smooth animations */
        #customModal {
            backdrop-filter: blur(4px);
        }
    </style>
</head>

<body class="p-2 sm:p-4 md:p-8">
    <div id="loadingScreen" class="fixed inset-0 bg-white flex items-center justify-center z-50">
        <div class="text-center px-4">
            <div class="animate-spin rounded-full h-12 w-12 sm:h-16 sm:w-16 border-b-4 border-indigo-600 mx-auto mb-4">
            </div>
            <p class="text-slate-600 text-base sm:text-lg">جاري التحميل...</p>
        </div>
    </div>
    <div id="app" class="max-w-4xl mx-auto" style="display: none;">
        <div class="flex justify-end mb-4 sm:mb-6 gap-2">
            <button id="loginBtn" type="button" onclick="toggleAdminLoginModal()"
                class="text-xl sm:text-2xl hover:scale-110 transition-transform p-2 cursor-pointer"
                title="دخول المعلم">⚙️</button>
            <button id="logoutBtn" type="button" onclick="logoutAdmin()"
                class="hidden text-xs sm:text-sm bg-red-500 text-white px-3 sm:px-4 py-2 rounded-full hover:bg-red-600 transition">تسجيل
                خروج المعلم</button>
        </div>

        <div id="studentLoginView"
            class="text-center py-12 sm:py-20 bg-white rounded-2xl shadow-sm border border-slate-200">
            <h1 class="text-2xl sm:text-3xl font-bold text-slate-800 mb-4 sm:mb-6 px-4">نظام متابعة مهارات لغتي</h1>
            <p class="text-slate-500 mb-6 sm:mb-8 px-4 text-sm sm:text-base">يرجى إدخال رقم الطالب الخاص بك للدخول</p>
            <div class="max-w-xs mx-auto px-4">
                <input id="studentCodeInput" type="text" placeholder="أدخل رقم الطالب"
                    class="w-full p-3 sm:p-4 text-center border-2 rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none text-lg sm:text-xl font-bold tracking-widest mb-3 sm:mb-4">
                <button onclick="accessWithCode()"
                    class="w-full bg-indigo-600 text-white py-3 sm:py-4 rounded-xl font-bold hover:bg-indigo-700 transition text-base sm:text-lg">دخول</button>
            </div>
        </div>

        <div id="adminDashboardView" class="hidden">
            <header class="text-center mb-6 sm:mb-10">
                <h1 class="text-2xl sm:text-3xl font-bold text-slate-800">لوحة تحكم المعلم</h1>
            </header>

            <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-4 sm:p-6 mb-6 sm:mb-8">
                <h3 class="text-base sm:text-lg font-bold text-indigo-900 mb-3 sm:mb-4">إضافة طالب جديد</h3>
                <div class="flex flex-col sm:flex-row gap-3 sm:gap-4">
                    <input id="newStudentName" type="text" placeholder="اسم الطالب الثلاثي"
                        class="flex-1 p-3 border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none text-sm sm:text-base">
                    <button onclick="addNewStudent()"
                        class="bg-green-600 text-white px-4 sm:px-6 py-3 rounded-lg hover:bg-green-700 transition text-sm sm:text-base whitespace-nowrap">توليد
                        رقم
                        الطالب</button>
                </div>
            </div>

            <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
                <div class="p-3 sm:p-4 bg-slate-50 border-b border-slate-200 font-bold text-sm sm:text-base">قائمة
                    الطلاب المضافين</div>
                <div id="adminStudentsList" class="divide-y divide-slate-100"></div>
            </div>

            <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-4 sm:p-6 mt-6 sm:mt-8">
                <h3 class="text-base sm:text-lg font-bold text-indigo-900 mb-3 sm:mb-4">إدارة المهارات المحفوظة</h3>
                <div id="savedSkillsList" class="space-y-2"></div>
            </div>
        </div>

        <div id="skillsDetailView" class="hidden">
            <div class="flex items-center justify-between mb-6 bg-white p-4 rounded-lg shadow-sm">
                <h2 id="currentStudentTitle" class="text-2xl font-bold text-indigo-700"></h2>
                <button onclick="backToHome()" class="text-indigo-600 hover:text-indigo-800 font-medium">← خروج</button>
            </div>

            <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
                <table class="w-full text-right border-collapse">
                    <thead>
                        <tr class="bg-slate-50 text-slate-600 border-b border-slate-200">
                            <th class="p-4 font-bold">المهارة</th>
                            <th class="p-4 font-bold">الملفات</th>
                            <th class="p-4 font-bold text-center">الحالة</th>
                            <th id="adminHeaderDelete" class="p-4 font-bold text-center hidden">حذف</th>
                        </tr>
                    </thead>
                    <tbody id="skillsTableBody"></tbody>
                </table>
            </div>

            <div id="adminControls"
                class="hidden mt-6 sm:mt-8 p-4 sm:p-6 bg-indigo-50 rounded-xl border border-indigo-100">
                <h3 class="text-base sm:text-lg font-bold text-indigo-900 mb-3 sm:mb-4">إضافة مهارة</h3>
                <div class="grid grid-cols-1 gap-3 sm:gap-4">
                    <select id="skillDropdown"
                        class="p-3 border rounded-lg bg-white outline-none focus:ring-2 focus:ring-indigo-500 text-sm sm:text-base">
                        <option value="">-- اختر مهارة --</option>
                        <option value="custom">✍️ مهارة أخرى...</option>
                    </select>
                    <input id="manualSkillInput" type="text" placeholder="اكتب المهارة يدوياً"
                        class="hidden p-3 border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none text-sm sm:text-base">
                    <input id="newFileLink" type="text" placeholder="رابط الملف"
                        class="p-3 border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none text-sm sm:text-base">
                </div>
                <button onclick="saveNewSkill()"
                    class="mt-4 bg-indigo-600 text-white px-6 sm:px-8 py-3 rounded-lg hover:bg-indigo-700 transition text-sm sm:text-base w-full sm:w-auto">إضافة</button>
            </div>
        </div>
    </div>

    <div id="adminLoginModal"
        class="fixed inset-0 bg-black bg-opacity-50 hidden flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-2xl p-6 sm:p-8 max-w-sm w-full shadow-2xl">
            <h3 class="text-lg sm:text-xl font-bold mb-4 text-center">دخول المعلم</h3>
            <input id="adminPasswordInput" type="password" placeholder="كلمة المرور"
                class="w-full p-3 border rounded-lg mb-4 outline-none focus:ring-2 focus:ring-indigo-500 text-sm sm:text-base"
                autofocus>
            <div class="flex gap-2">
                <button onclick="verifyAdminLogin()"
                    class="flex-1 bg-indigo-600 text-white py-2.5 sm:py-3 rounded-lg hover:bg-indigo-700 text-sm sm:text-base font-medium">دخول</button>
                <button onclick="toggleAdminLoginModal()"
                    class="flex-1 bg-slate-200 text-slate-700 py-2.5 sm:py-3 rounded-lg text-sm sm:text-base font-medium">إلغاء</button>
            </div>
        </div>
    </div>

    <footer class="text-center py-4 sm:py-6 text-slate-500 text-xs sm:text-sm">
        <p>صنع بـ 🤍 بواسطة الأستاذ سلطان الوليعي</p>
    </footer>

    <!-- Custom Modal -->
    <div id="customModal" class="fixed inset-0 bg-black bg-opacity-50 hidden flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-2xl p-6 max-w-sm w-full shadow-2xl transform transition-all scale-95"
            id="modalContent">
            <div id="modalIcon" class="text-center mb-4 text-5xl"></div>
            <h3 id="modalTitle" class="text-xl font-bold mb-3 text-center text-slate-800"></h3>
            <p id="modalMessage" class="text-center text-slate-600 mb-6 leading-relaxed"></p>
            <div id="modalButtons" class="flex gap-3"></div>
        </div>
    </div>

    <script src="app.js"></script>
    <script src="main.js"></script>
</body>

</html>
